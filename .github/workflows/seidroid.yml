# Wiring only. The review logic lives in sei-protocol/uci and the reviewer binary in
# sei-protocol/sei-internal-skills; both document their own behaviour and inputs.
#
#   @seidroid review                  review this pull request
#   @seidroid review close            destroy this pull request's session now
#
# A review request is read from a top-level comment, an inline review comment or a
# review body. A teardown is read from a top-level comment only.
#
# Four things here diverge from this repository's other workflows on purpose. Each is
# commented where it appears: the sha pin below, the lowercase `name:`, the empty
# top-level `permissions:`, and the absence of a `concurrency:` block.
#
# The `uses:` lines pin a raw commit sha, where uci-lint.yml, uci-release-check.yml,
# uci-release-publish.yml and uci-stale-check.yml each pin a uci tag. That is
# availability, not preference: this callee is on no uci tag and on no uci default
# branch -- the workflow file has no history on uci's `main` -- so there is no tag to
# name. Every other repository wiring this reviewer pins the same sha, and this file is
# bumped with them by path, so keep the three occurrences below identical.
#
# Lowercase, where this repository Title-Cases (`Go Linter`, `Releaser`, `Stale
# Checker`). `seidroid review` is the literal command a person types, and the callee
# sets `run-name: UCI / seidroid review / #<n>`; Title-Casing it would put this
# workflow's name at odds with its own trigger phrase and with every other caller.
name: seidroid review

on:
  issue_comment:
    types: [created]
  # The two review events as well, so `@seidroid review` reaches the pipeline when it
  # is typed where the discussion already is -- inside an inline diff thread or in a
  # review body. Without them a re-review needs a pushed commit, which means
  # manufacturing an empty one when the change is to the description or to
  # out-of-band evidence. The callee admits both events by name and applies the same
  # author checks to them.
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened, closed]

# Empty, where this repository's other workflows grant scopes at the top level. A
# reusable workflow may only downgrade what its caller granted, so a caller has to hand
# the callee its scopes explicitly -- and the default token grants contents, packages
# and metadata only, which the callee's guard cannot work with. Empty here means no job
# starts from a default; each states the four scopes the callee's own two jobs declare
# between them.
permissions: {}

# No `concurrency:` block, where all four uci callers in this repository set one with
# `cancel-in-progress: true`. Three reasons, in order:
#
#   - The callee already serialises, at a granularity a caller cannot express. Its
#     review job carries its own job-level `concurrency`, grouped on
#     mode + repository + pull request number with `cancel-in-progress: true`, so a
#     newer `@seidroid review` cancels an in-flight review while a teardown for the
#     same pull request sits in a different group and survives.
#   - A caller-level group covers the whole run, so it cannot make that distinction.
#     Any group keyed on the pull request would put the review job and the reclaim job
#     in one group, and a review arriving on a just-closed pull request would then
#     cancel the in-flight reclaim -- and `mode: close` is the only thing that reclaims
#     a session's sandbox.
#   - Cancelling a review frees nothing anyway. The driver traps cancellation and
#     stops its session, keeping the conversation; only a close deletes it.
jobs:
  seidroid-review:
    # `contains`, not `startsWith`, so a request still reads mid-sentence. The teardown
    # phrase is excluded here rather than anchored, so `@seidroid review close` asks
    # for exactly one thing.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed') ||
      (((github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null) ||
        github.event_name == 'pull_request_review_comment' ||
        github.event_name == 'pull_request_review') &&
        contains(github.event.comment.body || github.event.review.body,
          '@seidroid review') &&
        !contains(github.event.comment.body || github.event.review.body,
          '@seidroid review close'))
    uses: sei-protocol/uci/.github/workflows/seidroid-review.yml@d895e04ea5aacc796c6655d4c82a3ac7271fb04d
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    secrets:
      OMNIGENT_MACHINE_CLIENT_SECRET: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET }}
      SEIDROID_APP_ID: ${{ secrets.PLATFORM_CODE_AGENT_APP_ID }}
      SEIDROID_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_CODE_AGENT_APP_PK }}
    with:
      mode: review
      # A choice for this repository, not something inherited with the file: a clean
      # review publishes a real approving review, not a comment. Whether that approval
      # also clears a merge requirement is `main`'s policy and not this file's --
      # today it clears nothing, since `main` requires no approving review and pull
      # requests merge here with none. Requiring one would turn this line into a merge
      # gate, and that is the moment to revisit it.
      approve-on-success: true
      allowed-team: 'sei-protocol/sei-core'
      # Unset reads REVIEW.md, which this repository does not keep.
      guidelines-file: CLAUDE.md

  # Anchored, unlike the review job's `contains`. A comment that merely quotes the
  # teardown command -- which the reclaim job below asks a fork author to do -- must
  # not destroy a live session. Anchoring the review job too would trade that misroute
  # for a silent no-op, so only the destructive half is anchored.
  seidroid-review-close:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@seidroid review close')
    uses: sei-protocol/uci/.github/workflows/seidroid-review.yml@d895e04ea5aacc796c6655d4c82a3ac7271fb04d
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    secrets:
      OMNIGENT_MACHINE_CLIENT_SECRET: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET }}
      SEIDROID_APP_ID: ${{ secrets.PLATFORM_CODE_AGENT_APP_ID }}
      SEIDROID_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_CODE_AGENT_APP_PK }}
    with:
      # Deletes the review session and reclaims its sandbox. It does not close the
      # pull request.
      mode: close
      allowed-team: 'sei-protocol/sei-core'

  # Does not cover a fork: GitHub withholds secrets from a `pull_request` run whose
  # head is a fork, so the close cannot mint a credential and the sandbox is left
  # running. On a fork pull request, comment `@seidroid review close` before merging.
  seidroid-review-reclaim:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: sei-protocol/uci/.github/workflows/seidroid-review.yml@d895e04ea5aacc796c6655d4c82a3ac7271fb04d
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    secrets:
      OMNIGENT_MACHINE_CLIENT_SECRET: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET }}
      SEIDROID_APP_ID: ${{ secrets.PLATFORM_CODE_AGENT_APP_ID }}
      SEIDROID_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_CODE_AGENT_APP_PK }}
    with:
      mode: close
